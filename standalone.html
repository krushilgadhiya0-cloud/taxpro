  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Particle Background
    function CanvasParticles() {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);
        const particles = [];
        const colors = ['#00F0FF', '#00FFA3', '#A855F7', '#0066FF'];

        class Particle {
          constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.size = Math.random() * 2 + 1;
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
            this.color = colors[Math.floor(Math.random() * colors.length)];
          }
          update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
          }
          draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        for (let i = 0; i < 55; i++) particles.push(new Particle());

        const render = () => {
          ctx.clearRect(0, 0, width, height);
          particles.forEach(p => { p.update(); p.draw(); });
          animationFrameId = requestAnimationFrame(render);
        };
        render();

        return () => cancelAnimationFrame(animationFrameId);
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 opacity-70" />;
    }

    // Toast Container
    function Toast({ toast, onClose }) {
      if (!toast) return null;
      return (
        <div className="fixed top-20 right-6 z-50 p-4 rounded-2xl glass-panel border border-cyan-400/50 bg-black/90 text-white shadow-2xl flex items-center gap-3 animate-fade-in max-w-sm">
          <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
          <span className="text-xs font-semibold">{toast.msg}</span>
          <button onClick={onClose} className="ml-auto text-gray-400 hover:text-white text-xs">✕</button>
        </div>
      );
    }

    // Main Finexo App
    function FinexoApp() {
      const [tab, setTab] = useState('home');
      const [authenticated, setAuthenticated] = useState(false);
      const [pendingTab, setPendingTab] = useState(null);

      const [otpOpen, setOtpOpen] = useState(false);
      const [authOpen, setAuthOpen] = useState(false);
      const [pwaModalOpen, setPwaModalOpen] = useState(false);
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [pwaInstalling, setPwaInstalling] = useState(false);
      const [pwaInstalled, setPwaInstalled] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [country, setCountry] = useState('India (+91)');
      const [authPhone, setAuthPhone] = useState('');
      const [aiOpen, setAiOpen] = useState(false);
      const [toast, setToast] = useState(null);
      const [otp, setOtp] = useState(['', '', '', '', '', '']);
      const [verifying, setVerifying] = useState(false);
      const [status, setStatus] = useState('idle'); // 'idle' | 'verifying' | 'success' | 'error'
      const [countdown, setCountdown] = useState(60);
      const [testFail, setTestFail] = useState(false);

      useEffect(() => {
        const handlePrompt = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handlePrompt);
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log(err));
        }
        return () => window.removeEventListener('beforeinstallprompt', handlePrompt);
      }, []);

      const protectedTabs = ['dashboard', 'reports', 'payments', 'workers', 'attendance', 'security'];

      // Hero Card 3D Tilt State
      const [tilt, setTilt] = useState({ x: 0, y: 0 });

      const handleHeroMouseMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        setTilt({ x: -(y / 20), y: x / 20 });
      };

      const handleHeroMouseLeave = () => {
        setTilt({ x: 0, y: 0 });
      };

      // Biometric scanner state
      const [bioScanner, setBioScanner] = useState('fingerprint');
      const [bioScanning, setBioScanning] = useState(false);
      const [bioResult, setBioResult] = useState(null);

      // AI Chat messages
      const [aiMsgs, setAiMsgs] = useState([
        { sender: 'ai', text: 'Hello! I am TaxPro Neural AI. How can I assist with expense predictions, payroll optimization, or tax reports today?' }
      ]);
      const [aiInput, setAiInput] = useState('');

      const inputRefs = useRef([]);

      const showNotification = (msg) => {
        setToast({ msg });
        setTimeout(() => setToast(null), 3500);
      };

      const handleTabSelect = (t) => {
        if (protectedTabs.includes(t) && !authenticated) {
          setPendingTab(t);
          showNotification('🔒 Sign in required to access TaxPro features.');
          setAuthMode('login');
          setAuthOpen(true);
        } else {
          setTab(t);
        }
      };

      useEffect(() => {
        if (otpOpen && countdown > 0) {
          const t = setInterval(() => setCountdown(c => c - 1), 1000);
          return () => clearInterval(t);
        }
      }, [otpOpen, countdown]);

      const handleOtpChange = (index, value) => {
        const val = value.replace(/[^0-9]/g, '');
        const newOtp = [...otp];
        newOtp[index] = val.slice(-1);
        setOtp(newOtp);

        if (val && index < 5) inputRefs.current[index + 1]?.focus();

        if (newOtp.join('').length === 6) {
          setVerifying(true);
          setStatus('verifying');
          setTimeout(() => {
            if (testFail) {
              setStatus('error');
              setVerifying(false);
            } else {
              setStatus('success');
              if (window.confetti) window.confetti({ particleCount: 100, spread: 70 });
              setTimeout(() => {
                setAuthenticated(true);
                setOtpOpen(false);
                const dest = pendingTab || 'dashboard';
                setTab(dest);
                setPendingTab(null);
                setStatus('idle');
                setVerifying(false);
                showNotification('✓ OTP Verification Successful! Full TaxPro AI platform unlocked.');
              }, 2000);
            }
          }, 2200);
        }
      };

      const handleSendAi = (txt) => {
        const query = txt || aiInput;
        if (!query.trim()) return;

        setAiMsgs(prev => [...prev, { sender: 'user', text: query }]);
        setAiInput('');

        setTimeout(() => {
          let ans = `Analyzed neural parameters for "${query}". Projected revenue growth remains at +18.4%.`;
          if (query.toLowerCase().includes('expense')) ans = 'AI Expense Forecast: Q4 server costs will cap at $42,180 with 0% overflow risk.';
          if (query.toLowerCase().includes('payroll')) ans = 'Payroll Forecast: 142 personnel scheduled for payout. Total liquidity: $65,200.00.';

          setAiMsgs(prev => [...prev, { sender: 'ai', text: ans }]);
        }, 800);
      };

      const triggerBioScan = () => {
        setBioScanning(true);
        setBioResult(null);
        showNotification(`Initializing ${bioScanner.toUpperCase()} biometric scanner hardware...`);
        setTimeout(() => {
          setBioScanning(false);
          setBioResult({ name: 'Dr. Sarah Jenkins', time: new Date().toLocaleTimeString() });
          showNotification('Biometric minutiae verified for Dr. Sarah Jenkins!');
          if (window.confetti) window.confetti({ particleCount: 70, spread: 50 });
        }, 2000);
      };

      return (
        <div className="relative min-h-screen">
          <CanvasParticles />
          <Toast toast={toast} onClose={() => setToast(null)} />

          {/* Glass Navbar */}
          <nav className="fixed top-0 left-0 right-0 z-40 bg-black/60 backdrop-blur-xl border-b border-white/10 py-4 px-6 flex items-center justify-between">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setTab('home')}>
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-400 to-blue-600 p-[1px]">
                <div className="w-full h-full bg-black rounded-xl flex items-center justify-center font-extrabold text-cyan-400">TP</div>
              </div>
              <span className="font-extrabold text-xl tracking-tight text-white font-outfit">TAXPRO <span className="text-xs text-cyan-400 border border-cyan-400/40 px-2 py-0.5 rounded-full">AI 3.0</span></span>
            </div>

            <div className="hidden md:flex items-center gap-1.5 bg-white/5 p-1 rounded-2xl border border-white/10">
              {['home', 'dashboard', 'reports', 'payments', 'workers', 'attendance', 'security', 'pricing']
                .filter((t) => authenticated || (t === 'home' || t === 'pricing'))
                .map((t) => (
                  <button
                    key={t}
                    onClick={() => handleTabSelect(t)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold capitalize transition-all ${
                      tab === t ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-400/40' : 'text-gray-400 hover:text-white'

            </div>

            {authenticated ? (

                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span>Alex Sterling (CFO)</span>

            ) : (

                Get Started
              </button>

          {/* Hero View */}
          {tab === 'home' && (

              <span className="px-4 py-1.5 rounded-full bg-white/5 border border-cyan-400/40 text-xs font-semibold text-cyan-400 inline-block mb-6">

                {/* Header: Members Showcase Bar */}
                <div className="flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-white/10 pb-4 mb-6">

                      <img className="inline-block h-9 w-9 rounded-full ring-2 ring-emerald-400 object-cover" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80" alt="Marcus" />
                      <img className="inline-block h-9 w-9 rounded-full ring-2 ring-purple-400 object-cover" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=150&q=80" alt="Elena" />
                      <img className="inline-block h-9 w-9 rounded-full ring-2 ring-blue-400 object-cover" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=150&q=80" alt="Amara" />
                    </div>
                    <div className="flex flex-col text-left">
                      <span className="text-sm font-extrabold text-white flex items-center gap-1.5 font-outfit">
                        142 Active Members Logged
                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                      </span>
                      <span className="text-[10px] text-cyan-300 font-mono">Global TaxPro Workforce</span>
                    </div>
                  </div>

                  <div className="px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-400/40 text-cyan-400 text-xs font-bold font-mono">
                    ✦ 60 FPS Engine
                  </div>
                </div>

                {/* Floating Platform Features Grid */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="p-4 rounded-xl bg-white/5 border border-cyan-400/30">
                    <div className="text-xs font-bold text-cyan-400 mb-1">🖐️ Biometric Terminal</div>
                    <div className="text-[11px] text-gray-400">Fingerprint Laser, QR Scan, and Face Mesh recognition.</div>
                  </div>

                  <div className="p-4 rounded-xl bg-white/5 border border-purple-400/30">
                    <div className="text-xs font-bold text-purple-400 mb-1">🤖 Neural AI Engine</div>
                    <div className="text-[11px] text-gray-400">Expense predictions, payroll variance, and tax reports.</div>
                  </div>

                  <div className="p-4 rounded-xl bg-white/5 border border-emerald-400/30">
                    <div className="text-xs font-bold text-emerald-400 mb-1">💳 Multi-Rail Payments</div>
                    <div className="text-[11px] text-gray-400">Instant settlements via UPI, Card, Net Banking & SWIFT.</div>
                  </div>

                  <div className="p-4 rounded-xl bg-white/5 border border-blue-400/30">
                    <div className="text-xs font-bold text-blue-400 mb-1">🛡️ Quantum Risk Shield</div>
                    <div className="text-[11px] text-gray-400">AES-256 Bit zero-knowledge encryption & SOC2 audits.</div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Interactive Finexo PMS Dashboard View */}
          {tab === 'dashboard' && (
            <div className="pt-24 pb-20 px-4 sm:px-6 max-w-7xl mx-auto relative z-10 text-gray-200">
              
              {/* FINEXO PMS SUB-HEADER SEARCH & TOP ACTION BAR */}
              <div className="bg-[#141522] border border-white/10 rounded-2xl p-4 mb-6 flex flex-col md:flex-row items-center justify-between gap-4 shadow-lg">

                  <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-yellow-400 via-indigo-600 to-purple-600 p-[1px]">

                  </div>
                  <div>
                    <span className="px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 text-[10px] font-bold">PWA Web / Mobile App</span>
                    <h3 className="text-2xl font-extrabold text-white font-outfit">Install TaxPro 3.0</h3>
                    <p className="text-xs text-gray-400">Run native app on Windows, macOS, Android & iOS</p>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3 mb-6">
                  <div className="p-3 rounded-2xl bg-white/[0.03] border border-white/10 text-xs">
                    <div className="font-bold text-white">Full Offline Access</div>
                    <div className="text-[10px] text-gray-400">Service Worker cached ledger</div>
                  </div>
                  <div className="p-3 rounded-2xl bg-white/[0.03] border border-white/10 text-xs">
                    <div className="font-bold text-white">Instant 60FPS Launch</div>
                    <div className="text-[10px] text-gray-400">Home screen app shortcut</div>
                  </div>
                </div>

                {pwaInstalling && (
                  <div className="mb-4">
                    <div className="text-xs text-cyan-400 font-bold mb-1">Installing TaxPro 3.0 PWA Package...</div>
                    <div className="w-full h-2 rounded-full bg-white/10 overflow-hidden">
                      <div className="h-full bg-cyan-400 animate-pulse w-3/4"></div>
                    </div>
                  </div>
                )}

                {pwaInstalled ? (
                  <div className="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-center text-xs font-bold text-emerald-400">
                    ✓ TaxPro 3.0 PWA Installed Successfully!
                  </div>
                ) : (
                  <button
                    onClick={async () => {
                      if (deferredPrompt) {
                        deferredPrompt.prompt();
                        const { outcome } = await deferredPrompt.userChoice;
                        if (outcome === 'accepted') {
                          setPwaInstalled(true);
                          showNotification('🎉 TaxPro 3.0 PWA installed to your device home screen!');
                          if (window.confetti) window.confetti({ particleCount: 90, spread: 60 });
                        }
                      } else {
                        setPwaInstalling(true);
                        setTimeout(() => {
                          setPwaInstalling(false);
                          setPwaInstalled(true);
                          showNotification('🎉 TaxPro 3.0 PWA installed successfully!');
                          if (window.confetti) window.confetti({ particleCount: 90, spread: 60 });
                        }, 1200);
                      }
                    }}
                    disabled={pwaInstalling}
                    className="w-full py-3.5 btn-neon-primary text-xs font-bold shadow-lg shadow-cyan-500/30"
                  >
                    {pwaInstalling ? 'Installing App...' : 'Install TaxPro 3.0 PWA Now'}
                  </button>
                )}
              </div>
            </div>
          )}

          {/* Floating Install App Button (Bottom Left) */}
          <button
            onClick={() => setPwaModalOpen(true)}
            className="fixed bottom-6 left-6 z-40 px-4 py-2.5 rounded-full bg-black/90 border border-cyan-400/60 text-cyan-400 text-xs font-bold shadow-2xl backdrop-blur-xl hover:scale-105 transition-all shadow-cyan-500/20"
          >
            ⬇ Install TaxPro 3.0 App
          </button>

          {/* Floating AI Button */}
          {!aiOpen && (
            <button onClick={() => setAiOpen(true)} className="fixed bottom-6 right-6 z-40 p-4 rounded-full bg-gradient-to-tr from-cyan-400 to-purple-600 text-white shadow-2xl font-bold">
              AI
            </button>
          )}

          {/* Floating AI Window */}
          {aiOpen && (
            <div className="fixed bottom-6 right-6 z-50 w-full max-w-sm glass-panel p-4 border border-cyan-400/40 rounded-3xl shadow-2xl">
              <div className="flex justify-between border-b border-white/10 pb-3 mb-3">
                <span className="font-bold text-xs text-white">TaxPro Neural AI</span>
                <button onClick={() => setAiOpen(false)} className="text-gray-400 hover:text-white text-xs">✕</button>
              </div>
              <div className="h-48 overflow-y-auto flex flex-col gap-2 mb-3">
                {aiMsgs.map((m, idx) => (
                  <div key={idx} className={`p-2.5 rounded-xl text-xs ${m.sender === 'user' ? 'bg-cyan-500/20 text-cyan-200 ml-auto' : 'bg-white/5 text-gray-300 mr-auto'}`}>
                    {m.text}
                  </div>
                ))}
              </div>
              <div className="flex gap-2">
                <input type="text" placeholder="Ask AI..." value={aiInput} onChange={e => setAiInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSendAi()} className="flex-1 glass-input px-3 py-1.5 text-xs" />
                <button onClick={() => handleSendAi()} className="btn-neon-primary px-3 py-1.5 text-xs font-bold">Send</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<FinexoApp />);
  </script>
</body>
</html>
